<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SP-PPT - Sistem Penilaian Proyek Produksi Teater</title>
  <!-- Firebase SDK (v8 Compat untuk kompatibilitas stabil) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <!-- SheetJS untuk Export Excel (Versi Terkunci) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Stylesheet Utama -->
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-info">
        <h1>SP-PPT SMPN 10 Samarinda</h1>
        <p class="subtitle">Sistem Penilaian Proyek Produksi Teater</p>
      </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="main-content">
      <div class="card">
        <h2>Memuat Sistem...</h2>
        <p>Menyiapkan modul autentikasi dan basis data terpusat.</p>
      </div>
    </main>
  </div>

  <!-- Modal Global -->
  <div id="global-modal" class="modal-backdrop" style="display:none;">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Judul Modal</h3>
        <button onclick="closeModal()" class="btn-close">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Scripts Layer (Urutan Modular) -->
  <script src="src/core/config.js"></script>
  <script src="src/core/database.js"></script>
  <script src="src/core/utils.js"></script>
  <script src="src/core/auth.js"></script>
  <script src="src/features/main.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
