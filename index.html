<!doctype html>
<html lang="id">
<head>

  <meta name="theme-color" content="#0F172A" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <!-- Material Symbols -->

<body class="bg-surface font-sans text-base text-on-surface">

  <!-- App root -->
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">

    <!-- Main content -->
    <main class="flex-1 max-w-6xl mx-auto px-4 py-6 w-full" id="main"></main>

    <!-- Footer -->
    <footer class="bg-white border-t">
      <div class="max-w-6xl mx-auto px-4 py-4 text-sm text-gray-600">
        © <span id="footer-year"></span> SP-PPT — SMP Negeri 10 Samarinda • Versi <span id="app-version"></span>
      </div>
    </footer>
  </div>

  <!-- Toast container -->
  <div id="toast-root" class="fixed right-4 bottom-6 z-50 space-y-2"></div>

  <!-- Modules -->
